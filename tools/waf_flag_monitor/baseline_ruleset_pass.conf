# ============================================================
# BỘ RULE NỀN TẢNG (BASELINE) — route-agnostic, add từ đầu giải
# Sinh bởi rule_engine.generate_baseline_ruleset() — xem
# CHECKLIST_VAN_HANH_BASELINE.md để biết cách quan sát/vận hành.
# Action mặc định: pass,log
# ============================================================

# ---------- A. Protocol & Framing Hardening ----------

# Chặn HTTP Request Smuggling (CL + TE cùng tồn tại)
SecRule &REQUEST_HEADERS:Content-Length "@gt 0" \
    "id:28000,phase:1,pass,log,t:none,chain,\
    msg:'HTTP Smuggling CL+TE detected',tag:'smuggling'"
    SecRule &REQUEST_HEADERS:Transfer-Encoding "@gt 0" "t:none"

SecRule &REQUEST_HEADERS:Content-Length "@gt 1" "id:28001,phase:1,pass,log,t:none,msg:'Duplicate Content-Length',tag:'smuggling'"

SecRule &REQUEST_HEADERS:Transfer-Encoding "@gt 1" "id:28002,phase:1,pass,log,t:none,msg:'Duplicate Transfer-Encoding',tag:'smuggling'"

# Chặn biến thể Transfer-Encoding lạ (TE.TE / obfuscated)
SecRule REQUEST_HEADERS:Transfer-Encoding "!@rx (?i)^(?:chunked|gzip|deflate|compress|br)(?:\s*,\s*(?:chunked|gzip|deflate|compress|br))*\z" \
    "id:28003,phase:1,pass,log,t:none,\
    msg:'Obfuscated Transfer-Encoding header',tag:'smuggling',logdata:'TE=%{MATCHED_VAR}'"

SecRule REQUEST_HEADERS_NAMES "@rx (?i)^(?:transfer_encoding|content_length)$|^(?:transfer-encoding|content-length)\s+$" "id:28004,phase:1,pass,log,t:none,msg:'Malformed framing header name',tag:'smuggling'"

SecRule REQUEST_METHOD "!@rx ^(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\z" "id:28005,phase:1,pass,log,t:none,msg:'Disallowed HTTP method',tag:'waf-hardening',logdata:'%{REQUEST_METHOD}'"

SecRule REQUEST_HEADERS:Content-Type "@rx (?i)charset\s*=\s*[\x22\x27]?(?!(?:utf-?8|iso-8859-1|us-ascii|windows-125[0-8]|latin-?1)(?:[\x22\x27;\s]|$))[A-Za-z0-9_.-]+" "id:28006,phase:1,pass,log,t:none,msg:'Unusual Content-Type charset',tag:'waf-hardening',logdata:'%{MATCHED_VAR}'"

SecRule REQUEST_HEADERS:Origin "@rx (?i)^null\z" "id:28007,phase:1,pass,log,t:none,msg:'CORS Null Origin rejected',tag:'cors',logdata:'Origin=%{MATCHED_VAR}'"

SecRule REQUEST_HEADERS_NAMES "@rx (?i)^(?:X-Original-URL|X-Rewrite-URL|X-Override-URL|X-HTTP-Method-Override|X-Method-Override|X-Custom-IP-Authorization|X-HTTP-Host-Override|X-Forwarded-Host|X-Forwarded-Server|X-Forwarded-Scheme|X-Host|X-Real-IP|True-Client-IP|Client-IP)$" "id:28008,phase:1,pass,log,t:none,msg:'Blocked override/spoofing header',tag:'auth-bypass',logdata:'%{MATCHED_VAR_NAME}'"

# ---------- B. Recon & Path Hardening ----------

# Chặn truy cập file nhạy cảm / cấu hình / backup (có chuẩn hóa path)
SecRule REQUEST_FILENAME "@rx (?i)(?:^|/)(?:\.env(?:\.|$)|\.git(?:/|$)|\.svn(?:/|$)|\.hg(?:/|$)|\.ds_store$|\.ht(?:access|passwd)$|web\.config$|docker-compose\.ya?ml$|dockerfile$|id_rsa$|\.aws/|\.ssh/|console(?:/|;|\z)|actuator(?:/|;|\z))|\.(?:bak|backup|old|orig|save|swp|swo|sql|sqlite3?)(?:;[^/]*)?\z" \
    "id:28009,phase:1,pass,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Sensitive file access blocked',tag:'recon',logdata:'%{REQUEST_FILENAME}'"

# Chặn chạy script trong thư mục upload
SecRule REQUEST_FILENAME "@rx (?i)^/(?:uploads?|files?|tmp|images?|media|static|avatars?|storage|assets|data|public|attachments?|content)/.*\.(?:php\d?|phtml|phar|pht|jsp|jspx|asp|aspx|py|rb|sh|cgi)\.?(?:;[^/]*)?$" \
    "id:28010,phase:1,pass,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Block script execution in upload dir',tag:'upload',logdata:'%{REQUEST_FILENAME}'"

# Chặn Path Traversal trực tiếp trên URI (Phase 1)
SecRule REQUEST_URI "@rx (?i)(?:(?:\.|%(?:25)?2e|%%32%65|\xc0[\xae\x2e]|%c0%(?:ae|2e)|%(?:u002e|uff0e)){2,}(?:[;/\x5c]|%(?:25)?(?:2f|5c|3b)|\xc0[\xaf\x2f\x5c]|\xc1[\x9c\x1c]|%c0%af|%c1%9c|%u221[56]|%uff0f|%uff3c)|(?:^|/)\.\.\z)" \
    "id:28011,phase:1,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,\
    msg:'Path traversal in URI',tag:'lfi',logdata:'%{REQUEST_URI}'"

# ---------- C. Upload Content Hardening ----------

# Chặn nội dung Webshell / PHAR / SVG-XXE trong Multipart Upload (an toàn trên BunkerWeb — KHÔNG bật SecTmpSaveUploadedFiles)
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:28012,phase:2,pass,log,t:none,chain,\
    msg:'Webshell content in multipart upload',tag:'upload'"
    SecRule REQUEST_BODY "@rx (?i)(?:<\?(?:php|=|\s+(?:echo|system|exec|passthru|eval|\$))|<script\b|<%[\s=@]|Runtime\.getRuntime|ProcessBuilder|/bin/(?:ba)?sh|GIF89a<\?php|__HALT_COMPILER\s*\(\)|<!ENTITY|<!DOCTYPE[^>]*\[)" "t:none,t:removeNulls"

# Chặn tên file thực thi / double-extension / .htaccess khi upload
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^multipart/form-data" \
    "id:28014,phase:2,pass,log,t:none,chain,\
    msg:'Blocked dangerous script upload filename',tag:'upload'"
    SecRule FILES "@rx (?i)(?:\.(?:php\d?|phtml|phar|pht|phps|jsp|jspx|asp|aspx|py|rb|sh|cgi|pl|shtml)(?:\.[a-z0-9]{1,8}|\.|/|%00)?\z|(?:^|[/\x5c])(?:\.htaccess|\.user\.ini|web\.config)\z|[/\x5c]|\.\.)" "t:none,t:urlDecodeUni,t:lowercase"

# ---------- D. XXE ----------

# BƯỚC 1 (Phase 1): Ép body XML/SVG+xml giữ nguyên text để REQUEST_BODY soi được <!ENTITY
# (Lưu ý: nếu app thật cần CRS XML parser thì comment rule này lại)
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)(?:application|text|image)/(?:[a-z0-9.+-]*\+)?xml" \
    "id:28016,phase:1,pass,nolog,t:none,ctl:requestBodyProcessor=URLENCODED"

# BƯỚC 2 (Phase 2): Chặn XXE <!ENTITY / <!DOCTYPE / XInclude / SYSTEM
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)(?:application|text|image)/(?:[a-z0-9.+-]*\+)?xml" \
    "id:28017,phase:2,pass,log,t:none,chain,\
    msg:'XXE attempt',tag:'xxe'"
    SecRule REQUEST_BODY "@rx (?i)(<!ENTITY|<!DOCTYPE[^>]*\[|SYSTEM\s+[\x22\x27]|PUBLIC\s+[\x22\x27]|xmlns:xi\s*=|<\s*xi:include\b|xsi:schemaLocation\s*=|file://|php://|expect://|jar:|gopher://)" "t:none,t:removeNulls"

# ---------- E. Chữ Ký Tấn Công Chung (ATTACK_PATTERNS) ----------

# SQL Injection (Boolean / Auth / Comment / Bypass)
SecRule ARGS "@rx (?i)(?:(?:'|\x22)[\s\xa0]*(?:or|and|\|\||&&)[\s\xa0]*(?:(?:'|\x22)[^'\x22]{0,30}(?:'|\x22)[\s\xa0]*(?:=|!=|<>|like|rlike|regexp)[\s\xa0]*(?:'|\x22)[^'\x22]{0,30}(?:'|\x22)|['\x22]?\d+['\x22]?[\s\xa0]*(?:=|!=|<>|<|>)[\s\xa0]*['\x22]?\d+|true\b|false\b|not[\s\xa0]+0\b|1\.e\s*\(|['\x22][- &^*]?)|\)[\s\xa0]*(?:or|and|\|\||&&)[\s\xa0]*\(?[\s\xa0]*(?:['\x22]?\w+['\x22]?[\s\xa0]*=[\s\xa0]*['\x22]?\w+|true\b|\d+=\d+)|\b\d+[\s\xa0]+(?:or|and)[\s\xa0]+\d+[\s\xa0]*(?:=|!=|<>|<|>)\s*\d+|'\s*(?:--|#|/\*!|=\s*0\b)|/\*!\d{0,5}(?:union|select|and|or|if|sleep|benchmark|cast|convert|concat|extractvalue|updatexml)?|(?:'|\x22|\b\d+\b|\))[\s\xa0]*(?:\|\||&&)[\s\xa0]*\(?[\s\xa0]*(?:select\b|pg_sleep|sleep|case\b))" \
    "id:28019,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:compressWhitespace,\
    msg:'Baseline: SQL Injection (Boolean / Auth / Comment / Bypass)',tag:'sqli',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Chống SQLi tách từ bằng comment /**/ (UN/**/ION SE/**/LECT)
SecRule ARGS "@rx (?:(?:^|\b|\d[eE]\d*|\d\.e|\W)union[\s(]*(?:all[\s(]*|distinct[\s(]*)?select(?:\b|[\s(/*])|\bselect\s*(?:distinct\s*)?(?:\*|[\w.`()]+\s*,\s*[\w.`()]+|[a-z_]+\s*\()[^;]{0,120}\bfrom\s+[a-z_][a-z0-9_.$]{0,64}\s*(?:where|limit|order|group|having|union|\)|\z)|\b(?:sleep|benchmark|pg_sleep|extractvalue|updatexml|load_file|randomblob)\s*\()" \
    "id:28020,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:removeComments,t:compressWhitespace,t:lowercase,\
    msg:'Baseline: SQLi split-comment bypass',tag:'sqli',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Chống SQLi chèn comment thay khoảng trắng ('/**/OR/**/1=1)
SecRule ARGS "@rx (?i)(?:(?:'|\x22)[\s\xa0]*(?:or|and|\|\||&&)[\s\xa0]*(?:(?:'|\x22)[^'\x22]{0,30}(?:'|\x22)[\s\xa0]*(?:=|!=|<>|like|rlike|regexp)[\s\xa0]*(?:'|\x22)[^'\x22]{0,30}(?:'|\x22)|['\x22]?\d+['\x22]?[\s\xa0]*(?:=|!=|<>|<|>)[\s\xa0]*['\x22]?\d+|true\b|false\b|not[\s\xa0]+0\b|1\.e\s*\(|['\x22][- &^*]?)|\)[\s\xa0]*(?:or|and|\|\||&&)[\s\xa0]*\(?[\s\xa0]*(?:['\x22]?\w+['\x22]?[\s\xa0]*=[\s\xa0]*['\x22]?\w+|true\b|\d+=\d+)|\b\d+[\s\xa0]+(?:or|and)[\s\xa0]+\d+[\s\xa0]*(?:=|!=|<>|<|>)\s*\d+|'\s*(?:--|#|/\*!|=\s*0\b)|/\*!\d{0,5}(?:union|select|and|or|if|sleep|benchmark|cast|convert|concat|extractvalue|updatexml)?|(?:'|\x22|\b\d+\b|\))[\s\xa0]*(?:\|\||&&)[\s\xa0]*\(?[\s\xa0]*(?:select\b|pg_sleep|sleep|case\b))|(?:(?:^|\b|\d[eE]\d*|\d\.e|\W)union(?:/\*[^*]{0,40}\*/|[\s\xa0+(]){1,20}(?:(?:all|distinct(?:row)?)(?:/\*[^*]{0,40}\*/|[\s\xa0+(]){1,20})?select(?:\b|[\s(/*])|\(\s*select\b[^)]{0,160}\b(?:from\s+[a-z_][a-z0-9_.$]{0,64}|version\s*\(|sqlite_version\s*\(|current_database\s*\(|database\s*\(|user\s*\(|@@\w+)|\bselect\b(?:[\s\xa0]+distinct)?[^;]{0,160}\bfrom[\s\xa0]+[a-z_][a-z0-9_.$]{0,64}[\s\xa0]*(?:--|#|/\*|\bwhere\b|\blimit\b|\border[\s\xa0]+by\b|\bgroup[\s\xa0]+by\b|\bhaving\b|\bunion\b|\))|\bselect[\s\xa0]+(?:@@\w+|(?:sqlite_version|current_database|version|pg_read_file|load_extension)\s*\()|(?:'|\x22|\)|\d)[\s\xa0]*;[\s\xa0]*(?:select|insert|update|delete|drop|alter|create|truncate|exec|execute|declare|attach|copy|pragma|waitfor)\b|(?:'|\x22|\))[\s\xa0]*(?:and|or)[\s\xa0]+(?:substring|substr|ascii|ord|mid|length|char|if|case[\s\xa0]+when)\s*\(|\bcase[\s\xa0]+when\b[^;]{0,120}\bthen\b[^;]{0,120}\b(?:else|end)\b|\b(?:sleep|benchmark|pg_sleep|dbms_pipe\.receive_message|extractvalue|updatexml|load_file|randomblob|group_concat|concat_ws|unhex|gtid_subset|json_keys|name_const|load_extension|generate_series|query_to_xml|xp_cmdshell|openrowset)\s*\(|\bwaitfor[\s\xa0]+(?:delay|time)\b|\binto[\s\xa0]+(?:out|dump)file\b|\bdrop[\s\xa0]+table\b|\b(?:information_schema|sqlite_(?:master|schema|temp_master)|pragma_table_info|pg_(?:catalog|tables|shadow|user)|mysql\.(?:user|db|innodb_table_stats)|master\.\.sys(?:databases|objects|columns))\b|\b(?:cast|convert)\s*\([^)]{0,120}(?:\bas[\s\xa0]+(?:int|integer|numeric|signed)|,[\s\xa0]*int)\b|/\*!\d{0,5}\s*(?:union|select|insert|update|delete|drop|and|or|if|sleep|benchmark|cast|convert|concat|extractvalue|updatexml|load_file)\b)" \
    "id:28021,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:replaceComments,t:compressWhitespace,t:lowercase,\
    msg:'Baseline: SQLi comment-space bypass',tag:'sqli',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# SQL Injection (UNION / Subquery / Blind / Stacked)
SecRule ARGS "@rx (?i)(?:(?:^|\b|\d[eE]\d*|\d\.e|\W)union(?:/\*[^*]{0,40}\*/|[\s\xa0+(]){1,20}(?:(?:all|distinct(?:row)?)(?:/\*[^*]{0,40}\*/|[\s\xa0+(]){1,20})?select(?:\b|[\s(/*])|\(\s*select\b[^)]{0,160}\b(?:from\s+[a-z_][a-z0-9_.$]{0,64}|version\s*\(|sqlite_version\s*\(|current_database\s*\(|database\s*\(|user\s*\(|@@\w+)|\bselect\b(?:[\s\xa0]+distinct)?[^;]{0,160}\bfrom[\s\xa0]+[a-z_][a-z0-9_.$]{0,64}[\s\xa0]*(?:--|#|/\*|\bwhere\b|\blimit\b|\border[\s\xa0]+by\b|\bgroup[\s\xa0]+by\b|\bhaving\b|\bunion\b|\))|\bselect[\s\xa0]+(?:@@\w+|(?:sqlite_version|current_database|version|pg_read_file|load_extension)\s*\()|(?:'|\x22|\)|\d)[\s\xa0]*;[\s\xa0]*(?:select|insert|update|delete|drop|alter|create|truncate|exec|execute|declare|attach|copy|pragma|waitfor)\b|(?:'|\x22|\))[\s\xa0]*(?:and|or)[\s\xa0]+(?:substring|substr|ascii|ord|mid|length|char|if|case[\s\xa0]+when)\s*\(|\bcase[\s\xa0]+when\b[^;]{0,120}\bthen\b[^;]{0,120}\b(?:else|end)\b|\b(?:sleep|benchmark|pg_sleep|dbms_pipe\.receive_message|extractvalue|updatexml|load_file|randomblob|group_concat|concat_ws|unhex|gtid_subset|json_keys|name_const|load_extension|generate_series|query_to_xml|xp_cmdshell|openrowset)\s*\(|\bwaitfor[\s\xa0]+(?:delay|time)\b|\binto[\s\xa0]+(?:out|dump)file\b|\bdrop[\s\xa0]+table\b|\b(?:information_schema|sqlite_(?:master|schema|temp_master)|pragma_table_info|pg_(?:catalog|tables|shadow|user)|mysql\.(?:user|db|innodb_table_stats)|master\.\.sys(?:databases|objects|columns))\b|\b(?:cast|convert)\s*\([^)]{0,120}(?:\bas[\s\xa0]+(?:int|integer|numeric|signed)|,[\s\xa0]*int)\b|/\*!\d{0,5}\s*(?:union|select|insert|update|delete|drop|and|or|if|sleep|benchmark|cast|convert|concat|extractvalue|updatexml|load_file)\b)" \
    "id:28022,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:compressWhitespace,t:lowercase,\
    msg:'Baseline: SQL Injection (UNION / Subquery / Blind / Stacked)',tag:'sqli',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# NoSQL Operator Injection ($ne/$where/$regex...)
SecRule ARGS_NAMES "@rx (?i)(?:^\$|\.\$|\[\s*\$|\$(?:ne|eq|gt|gte|lt|lte|in|nin|where|regex|exists|or|and|not|nor|expr|jsonSchema|mod|type|elemMatch|size|all)\b)" \
    "id:28023,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:jsDecode,\
    msg:'Baseline: NoSQL Operator Injection ($ne/$where/$regex...)',tag:'nosqli',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# LFI / Path Traversal / PHP FilterChain
SecRule ARGS "@rx (?i)(?:(?:\.\.[;/\x5c]){2,}|(?:\xc0[\xae\x2e]\xc0[\xae\x2e]|%2e%2e|%252e%252e|%%32%65%%32%65|%c0%ae%c0%ae|%c0%2e%c0%2e|%e0%40%ae|%u002e%u002e|%uff0e%uff0e|%u2025|%ufe30|0x2e0x2e|\.\.\.+)(?:[;/\x5c]|\xc0[\xaf\x2f\x5c]|\xc1[\x9c\x1c]|\xe0\x80[\xaf\x5c]|%2f|%5c|%252f|%255c|%c0%af|%c0%2f|%c0%5c|%c1%9c|%c1%1c|%e0%80%af|%u2215|%u2216|%uff0f|%uff3c|0x2f)|(?:/|\x5c)\.\.\z|(?:php|phar|zip|data|expect|glob|file|zlib|bzip2|rar|ogg|compress\.zlib|compress\.bzip2|ssh2\.[a-z]+|netdoc)://|convert\.(?:iconv|base64)\.|string\.rot13|filter/read=|^(?:/etc/|/proc/|/var/(?:log|lib/php|www)/|/home/|/root/|/run/secrets/|[A-Za-z]:[/\x5c]|\x5c\x5c))" \
    "id:28024,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:utf8toUnicode,t:lowercase,\
    msg:'Baseline: LFI / Path Traversal / PHP FilterChain',tag:'lfi',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Command Injection (Shell / IFS / Glob / Obfuscated)
SecRule ARGS "@rx (?i)(?:[;|`]\s*(?:id|whoami|cat|tac|head|tail|nl|ls|dir|type|uname|pwd|ping|curl|wget|nc|ncat|netcat|socat|sh|bash|dash|zsh|ksh|python\d?|php\d?|perl|ruby|node|lua|awk|gawk|sed|grep|egrep|more|less|base64|base32|xxd|od|strings|tr|cut|sort|uniq|wc|tee|xargs|find|env|printenv|sleep|usleep|timeout|echo|printf|ps|ss|netstat|lsof|nslookup|dig|telnet|powershell|cmd)\b(?!\s*=)|[\r\n]\s*(?:id|whoami|cat|tac|head|tail|nl|ls|dir|type|uname|pwd|ping|curl|wget|nc|ncat|netcat|socat|sh|bash|dash|zsh|ksh|python\d?|php\d?|perl|ruby|node|lua|awk|gawk|sed|grep|egrep|more|less|base64|base32|xxd|od|strings|tr|cut|sort|uniq|wc|tee|xargs|find|env|printenv|sleep|usleep|timeout|echo|printf|ps|ss|netstat|lsof|nslookup|dig|telnet|powershell|cmd)\b(?!\s*=)|\x00|\$\([^)]{0,200}\)|<[<(]|\$\{?(?:IFS|[@*0-9]|HOME:|PATH:|SHELL:)[^}]{0,30}\}?|\$[@*]|\$'[^']{1,120}'|\{[a-z/?*_-]{1,32},[^}]{1,120}\}|/(?:\?{2,6}/[a-z0-9_?*\[\]-]{1,16}|(?:bin|usr/bin|sbin)/[a-z0-9_?*.-]*[?*\[][a-z0-9_?*.-]*)|\|\||&&|(?:<<<|>>?\s*/(?:etc|tmp|var|dev|proc|home|root|app)|<\s*/(?:etc|proc|flag|dev/tcp)|/dev/(?:tcp|udp)/|2>&1|1>&2)|&\s*(?:/(?:[a-z0-9_?*\[\]-]+/){0,5}[a-z0-9_?*\[\]-]+|[a-z_]{1,12}[\x27\x22\\^][a-z0-9_\x27\x22\\^*?./-]+|\$\{|[<>]|(?:id|whoami|cat|tac|head|tail|nl|ls|dir|type|uname|pwd|ping|curl|wget|nc|ncat|netcat|socat|sh|bash|dash|zsh|ksh|python\d?|php\d?|perl|ruby|node|lua|awk|gawk|sed|grep|egrep|more|less|base64|base32|xxd|od|strings|tr|cut|sort|uniq|wc|tee|xargs|find|env|printenv|sleep|usleep|timeout|echo|printf|ps|ss|netstat|lsof|nslookup|dig|telnet|powershell|cmd)\b(?!\s*=)))" \
    "id:28025,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,\
    msg:'Baseline: Command Injection (Shell / IFS / Glob / Obfuscated)',tag:'cmdi',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Chống CMDi chèn quote/backslash/caret (c'a't, c\at, c^at)
SecRule ARGS "@rx (?:/?(?:usr/(?:local/)?)?(?:s?bin/)?(?:ba|da|z|k|c)?sh\s+-[ic]|/(?:usr/)?s?bin/(?:cat|tac|head|tail|nl|base64|xxd|od|python\d?|perl|ruby|php|nc|ncat|socat|curl|wget|id|whoami|uname|env|printenv|awk|sed|grep|find)|(?:cat|tac|head|tail|nl|more|less|base64|xxd|od|strings|grep|awk|sed)\s+(?:/etc/|/proc/|/var/|/home/|/root/|/app/|/flag|flag\.txt|\$[a-z_{])|(?:whoami|uname\s+-a|printenv\b|curl\s+https?://|wget\s+https?://|nc\s+-[elvp]|powershell\s+-))" \
    "id:28026,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:removeNulls,t:cmdLine,\
    msg:'Baseline: CMDi obfuscated command (t:cmdLine)',tag:'cmdi',logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}'"

# Code Injection (PHP/Python/Node/Java Eval)
SecRule ARGS "@rx (?i)(?:\b(?:system|exec|shell_exec|passthru|popen|proc_open|pcntl_exec|call_user_func|create_function|eval|assert)\s*\(|\b(?:include|require)(?:_once)?\s*\(|\b(?:base64_decode|gzinflate|str_rot13|convert_uudecode)\s*\(|__(?:import|builtins|globals|subclasses|mro|base|bases|init|getitem)__|\b(?:os\.(?:system|popen|exec\w*)|subprocess\.(?:Popen|run|check_output|call)|importlib)\b|\brequire\s*\(\s*[\x22\x27](?:child_process|fs|net|http|vm)|child_process|mainModule|global\.process|process\.binding|java\.lang\.(?:Runtime|ProcessBuilder))" \
    "id:28027,phase:2,pass,log,t:none,t:urlDecodeUni,t:urlDecodeUni,t:jsDecode,t:removeNulls,t:lowercase,\
