# ============================================================
# TEAM DEFENSE RULES — test file
# Dùng để chạy: python3 waf_rule_tester.py rules_test.conf
# ============================================================

# Rule 1: Chặn flag lọt ra response
SecRule RESPONSE_BODY "@rx FHACKER2026\{[0-9a-f]{64}\}" \
    "id:20001,phase:4,deny,status:403,log,\
    msg:'Flag leak blocked',tag:'team-flag-leak'"

# Rule 2: SQLi — regex an toàn
SecRule ARGS|REQUEST_BODY "@rx (?i)(?:union\s+select|drop\s+table|insert\s+into|'\s*or\s*')" \
    "id:20002,phase:2,deny,status:403,log,t:none,t:urlDecodeUni,t:lowercase,\
    msg:'SQLi attempt',tag:'team-sqli'"

# Rule 3 (XẤU — để test): Regex dễ gây ReDoS
SecRule ARGS "@rx (select|union|insert|update|delete|drop).*from.*where.*" \
    "id:20003,phase:2,deny,status:403,log,\
    msg:'Bad regex example',tag:'team-sqli-bad'"

# Rule 4: LFI
SecRule REQUEST_URI|ARGS "@rx (?:\.\.\/|\.\.\\|%2e%2e%2f)" \
    "id:20004,phase:1,deny,status:403,log,t:none,t:urlDecodeUni,\
    msg:'Path traversal',tag:'team-lfi'"

# Rule 5 (CÓ FALSE POSITIVE — để test): Chặn từ "select" mọi nơi
SecRule ARGS "@contains select" \
    "id:20005,phase:2,deny,status:403,log,t:none,t:lowercase,\
    msg:'Contains select — false positive risk',tag:'team-fp-example'"
